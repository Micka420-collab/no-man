# Construit site/ (Atlas Terminal) et le publie sur GitHub Pages.
#
# C'est LE workflow de déploiement du site en ligne depuis la bascule vers l'Atlas
# Terminal (l'ancien deploy-pages.yml, qui servait l'index.html racine, a été retiré —
# le fichier reste dans git, seul ce qui est servi a changé).
#
# Fraîcheur des données : avant chaque build, les JSON de data/ (racine, mis à jour
# toutes les 3 h par update-news.yml) sont recopiés dans site/public/data/, et les
# deux fichiers dérivés (workshop.json, substances.json) sont régénérés depuis le
# catalogue frais. Le déclencheur workflow_run est indispensable : les commits poussés
# par update-news.yml avec le GITHUB_TOKEN ne déclenchent PAS les workflows `push`.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Mise à jour des actualités NMS"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Synchroniser les données fraîches (data/ racine → site)
        run: |
          for f in data/*.json; do
            case "$(basename "$f")" in
              catalogue.json) ;;  # 2,7 Mo — jamais servi au navigateur, sert à régénérer ci-dessous
              *) cp -f "$f" site/public/data/ ;;
            esac
          done
          node site/scripts/build-workshop-data.mjs data/catalogue.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
